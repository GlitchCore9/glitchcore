    .drag-placeholder{border:1px dashed var(--green);background:#edf3e9}.list-row.is-dragging{z-index:10;opacity:.96;pointer-events:none;box-shadow:0 12px 30px #17251f35;will-change:transform}.contest-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:-7px 0 22px;padding:14px 16px;border:1px solid var(--line);background:#f8f8f3}.contest-status{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800}.contest-status::before{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:#268257;content:""}.contest-controls.is-paused .contest-status::before{background:#c65c48}.contest-controls p{margin:5px 0 0 19px;color:var(--muted);font-size:11px}.contest-actions{display:flex;gap:8px}.contest-actions .button{white-space:nowrap}.contest-confirm{margin:0;color:var(--ink);font-size:13px;line-height:1.65}.contest-warning{margin-top:9px;padding:10px 12px;background:#fbf0e9;color:#8c3e2e;font-size:11px;line-height:1.5}.paused-vote{margin-top:20px;padding:20px;border:1px solid #e5c9bc;background:#fbf1ec}.paused-vote h2{margin:0 0 7px;color:#87452f;font-size:17px}.paused-vote p{margin:0;color:#68564d;font-size:12px;line-height:1.55}

<body>
  <div id="app"><main class="judge-shell"><p>Загрузка приложения…</p></main></div>
  <dialog class="dialog" id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="dialog-close" type="button" aria-label="Закрыть" data-close>×</button></div><form class="dialog-form" id="dialog-form"></form></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    const STORE_KEY = 'jury-vote-demo-v1';
    const defaultState = {
      title: 'Конкурс моделей 2026', minScore: 1, maxScore: 5, isActive: true,
      categories: ['Визитка', 'Brand', 'Богиня', 'Подача', 'Вечерний образ'].map((name, index) => ({ id: `c${index + 1}`, name })),
      participants: [
        { id: 'p1', surname: 'Болдырева', name: 'Ярослава', age: 8 }, { id: 'p2', surname: 'Самойлова', name: 'Камилла', age: 7 },
        { id: 'p3', surname: 'Перепелица', name: 'Мария', age: 9 }, { id: 'p4', surname: 'Османова', name: 'Ева', age: 10 },
        { id: 'p5', surname: 'Козлова', name: 'Варвара', age: 8 }, { id: 'p6', surname: 'Лупинос', name: 'Сандра', age: 10 },
        { id: 'p7', surname: 'Клячкова', name: 'Мирослава', age: 14 }, { id: 'p8', surname: 'Власова', name: 'Милана', age: 15 }
      ],
      judges: Array.from({ length: 10 }, (_, index) => ({ id: `j${index + 1}`, name: `Судья ${index + 1}` })), votes: {}, activeTab: 'results'
    };
    let state;
    try { state = { ...defaultState, ...JSON.parse(localStorage.getItem(STORE_KEY) || '{}') }; } catch { state = structuredClone(defaultState); }
    if (!state.categories) state.categories = defaultState.categories;
    if (!state.participants) state.participants = defaultState.participants;
    if (!state.judges) state.judges = defaultState.judges;
    if (!state.votes) state.votes = {};
    const app = document.querySelector('#app');
    const dialog = document.querySelector('#dialog');
    let toastTimer;
    const esc = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const persist = () => {
      if (!window.ContestCloud?.isConnected()) localStorage.setItem(STORE_KEY, JSON.stringify(state));
      window.ContestCloud?.persistState(state);
    };
    const judgeToken = () => new URLSearchParams(location.hash.slice(1)).get('judge');
    const fullName = person => `${person.surname} ${person.name}`;
    const getTotals = () => state.participants.map(person => {
      let total = 0;
      const categories = state.categories.map(category => {
        let subtotal = 0;
        for (const judge of state.judges) subtotal += Number(state.votes[judge.id]?.[person.id]?.[category.id] || 0);
        total += subtotal;
        return subtotal;
      });
      return { person, categories, total };
    }).sort((a, b) => b.total - a.total || fullName(a.person).localeCompare(fullName(b.person), 'ru'));
    const votersCount = () => state.judges.filter(judge => state.votes[judge.id]?.submitted).length;
    function createDemoState() {
      const demo = structuredClone(defaultState);
      demo.title = 'Демо · Конкурс моделей';
      demo.activeTab = 'results';
      const scoreCount = demo.maxScore - demo.minScore + 1;
      demo.judges.slice(0, 3).forEach((judge, judgeIndex) => {
        const ballot = { submitted: true };
        demo.participants.forEach((person, personIndex) => {
          ballot[person.id] = {};
          const performance = (demo.participants.length - 1 - personIndex) / Math.max(demo.participants.length - 1, 1);
          const baseScore = demo.minScore + Math.round((demo.maxScore - demo.minScore) * performance);
          demo.categories.forEach((category, categoryIndex) => {
            const variation = (categoryIndex + judgeIndex + personIndex) % Math.min(scoreCount, 3) - 1;
            ballot[person.id][category.id] = Math.max(demo.minScore, Math.min(demo.maxScore, baseScore + variation));
          });
        });
        demo.votes[judge.id] = ballot;
      });
      return demo;
    }
    const navItems = [['results', '▤', 'Результаты'], ['people', '♙', 'Участницы'], ['categories', '◈', 'Категории'], ['judges', '♧', 'Жюри']];
    function saveSortOrder(list, collection) {
      const itemsById = new Map(state[collection].map(item => [item.id, item]));
      state[collection] = [...list.querySelectorAll('[data-sort-item]')].map(row => itemsById.get(row.dataset.sortId));
      persist(); render();
    }
    const navButton = ([id, icon, label], mobile = false) => `<button type="button" data-tab="${id}" aria-current="${state.activeTab === id}" aria-label="${label}"><span class="${mobile ? '' : 'nav-icon'}">${icon}</span>${mobile ? `<span>${label}</span>` : label}</button>`;
    function render() {
      const token = judgeToken();
      if (token) { renderJudge(token); return; }
      const completed = votersCount();
      const totalVotes = completed * state.participants.length * state.categories.length;
      app.innerHTML = `<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">Ж</span><div><div class="brand-name">ЖЮРИ / CONTEST</div><div class="brand-caption">ПАНЕЛЬ УПРАВЛЕНИЯ</div></div></div><div class="nav-label">Рабочее пространство</div><nav class="nav" aria-label="Разделы">${navItems.map(item => navButton(item)).join('')}<button class="nav-tool" type="button" data-action="load-demo"><span class="nav-icon">✦</span><span>Демо</span></button></nav><div class="side-bottom"><p><i class="status-dot"></i>Демо-режим</p><small>Данные этого прототипа сохраняются только в браузере.</small></div></aside><main class="main"><header class="topbar"><span class="crumb">Конкурсы　/　${esc(state.title)}</span><div class="top-actions"><span class="demo-label">ЛОКАЛЬНЫЙ ПРОТОТИП</span><span class="admin-pill"><i class="avatar">А</i> Администратор</span></div></header><div class="content"><div class="notice"><span aria-hidden="true">ⓘ</span><span><b>Это демонстрационный режим.</b> Ссылки и голоса пока доступны только в этом браузере. Чтобы судьи голосовали с разных телефонов и работала выдача доступов организаторам, понадобится подключить сервер и базу данных.</span></div>${renderPage(completed, totalVotes)}</div></main><nav class="mobile-nav" aria-label="Разделы">${navItems.map(item => navButton(item, true)).join('')}<button type="button" data-action="load-demo"><span>✦</span><span>Демо</span></button></nav></div>`;
      const mobileNav = app.querySelector('.mobile-nav');
      if (mobileNav) mobileNav.style.gridTemplateColumns = `repeat(${mobileNav.children.length}, minmax(0, 1fr))`;
      window.ContestCloud?.decorate();
    }
    function renderPage(completed, totalVotes) {
      const page = state.activeTab === 'people' ? renderPeople()
        : state.activeTab === 'categories' ? renderCategories()
          : state.activeTab === 'judges' ? renderJudges()
            : renderResults(completed, totalVotes);
      return `${renderContestControls()}${page}`;
    }
    function renderContestControls() {

')}</span><div><div class="person-name">${esc(fullName(item.person))}</div><div class="person-age">${item.person.age} лет</div></div></div></td>${item.categories.map(score => `<td class="score-cell">${score || '—'}</td>`).join('')}<td class="total-cell">${item.total}<div class="bar"><i style="width:${Math.round(item.total / maxTotal * 100)}%"></i></div></td></tr>`).join('') : `<tr><td colspan="${state.categories.length + 3}" class="empty">Добавьте участниц, чтобы сформировать рейтинг.</td></tr>`}</tbody></table></div>`;

el="Удалить ${esc(category.name)}">×</button></div></div>`).join('') || `<div class="empty">Добавьте категорию, по которой жюри будет ставить баллы.</div>`}</div></section>`;

      const bounds = row.getBoundingClientRect();
      const placeholder = document.createElement('div');
      placeholder.className = 'list-row drag-placeholder';
      placeholder.setAttribute('aria-hidden', 'true');
      placeholder.style.height = `${bounds.height}px`;
      row.before(placeholder);
      handle.setPointerCapture(event.pointerId);
      activeDrag = { row, list, collection, placeholder, pointerId: event.pointerId, startY: event.clientY, originalStyle: row.getAttribute('style'), initialIds: [...list.querySelectorAll('[data-sort-item]')].map(item => item.dataset.sortId) };
      row.classList.add('is-dragging');
      Object.assign(row.style, { position: 'fixed', top: `${bounds.top}px`, left: `${bounds.left}px`, width: `${bounds.width}px`, margin: '0', zIndex: '10', pointerEvents: 'none', transform: 'translateY(0px)' });
    });
    app.addEventListener('pointermove', event => {
      const drag = activeDrag;
      if (!drag || event.pointerId !== drag.pointerId) return;
      event.preventDefault();
      drag.row.style.transform = `translateY(${event.clientY - drag.startY}px)`;
      if (event.clientY < 70) window.scrollBy(0, -12);
      if (event.clientY > window.innerHeight - 70) window.scrollBy(0, 12);
      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-sort-item]');
      if (!target || target === drag.row || target.parentElement !== drag.list) return;
      drag.list.querySelectorAll('.is-drop-target').forEach(item => item.classList.remove('is-drop-target'));
      target.classList.add('is-drop-target');
      const bounds = target.getBoundingClientRect();
      drag.list.insertBefore(drag.placeholder, event.clientY < bounds.top + bounds.height / 2 ? target : target.nextElementSibling);
    });
    function finishDrag(commit, pointerId) {
      const drag = activeDrag;
      if (!drag || drag.pointerId !== pointerId) return;
      activeDrag = null;
      drag.row.classList.remove('is-dragging');
      drag.placeholder.replaceWith(drag.row);
      if (drag.originalStyle === null) drag.row.removeAttribute('style');
      else drag.row.setAttribute('style', drag.originalStyle);
      drag.list.querySelectorAll('.is-drop-target').forEach(item => item.classList.remove('is-drop-target'));
      if (commit) {
        saveSortOrder(drag.list, drag.collection);
      } else {
        const rowsById = new Map([...drag.list.querySelectorAll('[data-sort-item]')].map(row => [row.dataset.sortId, row]));
        drag.initialIds.forEach(id => drag.list.append(rowsById.get(id)));
      }
    }
    app.addEventListener('pointerup', event => finishDrag(true, event.pointerId));
    app.addEventListener('pointercancel', event => finishDrag(false, event.pointerId));
    app.addEventListener('keydown', event => {
      const handle = event.target.closest('.drag-handle');
      if (!handle || !event.altKey || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
      const row = handle.closest('[data-sort-item]');
      const list = row?.parentElement;
      const neighbor = event.key === 'ArrowUp' ? row?.previousElementSibling : row?.nextElementSibling;
      if (!row || !list?.dataset.sortList || !neighbor?.matches('[data-sort-item]')) return;
      event.preventDefault();
      if (event.key === 'ArrowUp') list.insertBefore(row, neighbor);
      else list.insertBefore(neighbor, row);
      saveSortOrder(list, list.dataset.sortList);
    });
    app.addEventListener('change', event => {
      if (event.target.id !== 'category-filter') return;
      const selected = event.target.value;
      for (const row of document.querySelectorAll('#ranking-body tr')) [...row.children].forEach((cell, index) => { if (index > 1 && index < row.children.length - 1) cell.hidden = selected !== 'all' && state.categories[index - 2]?.id !== selected; });
      const headings = [...document.querySelectorAll('thead th')];
      headings.forEach((cell, index) => { if (index > 1 && index < headings.length - 1) cell.hidden = selected !== 'all' && state.categories[index - 2]?.id !== selected; });
    });
    app.addEventListener('submit', event => {
      if (event.target.id === 'ballot-form') {
        event.preventDefault(); const judge = state.judges.find(item => item.id === judgeToken()); if (!judge || state.votes[judge.id]?.submitted) return;
        const ballot = state.votes[judge.id] || {};
        const complete = state.participants.every(person => state.categories.every(category => ballot[person.id]?.[category.id] !== undefined));
        if (!complete) { showToast('Поставьте оценку в каждой категории для всех участниц'); return; }
        if (confirm('Отправить бюллетень? После отправки изменить оценки нельзя.')) { ballot.submitted = true; state.votes[judge.id] = ballot; persist(); render(); }
      }
      if (event.target.id === 'scale-form') {
        event.preventDefault(); const min = Number(document.querySelector('#min-score').value), max = Number(document.querySelector('#max-score').value);
        if (!Number.isInteger(min) || !Number.isInteger(max) || min < 0 || max <= min || max > 100) { showToast('Укажите корректный диапазон баллов'); return; }
        state.minScore = min; state.maxScore = max; persist(); render(); showToast('Шкала оценок обновлена');
      }
    });
    window.addEventListener('storage', event => {
      if (window.ContestCloud?.isConnected()) return;
      if (event.key !== STORE_KEY || !event.newValue) return;
      state = { ...defaultState, ...JSON.parse(event.newValue) };
      render();
    });
    window.addEventListener('hashchange', () => {
      if (!window.CONTEST_SUPABASE_CONFIG?.url) render();
    });
    window.ContestApp = {
      getState: () => state,
      setState: nextState => { state = nextState; render(); },
      persist,
      render,
      renderJudge,
      showToast,
    };
    if (window.CONTEST_SUPABASE_CONFIG?.url && window.CONTEST_SUPABASE_CONFIG?.publishableKey) {
      app.innerHTML = '<main class="judge-shell"><p>Загрузка рабочего пространства…</p></main>';
    } else {
      render();
      app.dataset.ready = 'true';
    }
    setTimeout(() => {
      if (app.dataset.ready === 'true') return;
      app.innerHTML = '<main class="judge-shell"><p>Не удалось загрузить приложение. Проверьте подключение и обновите страницу.</p></main>';
      app.dataset.ready = 'true';
    }, 15000);
  </script>
